[project]
name = "ceb-mcp"
version = "0.1.0"
description = "Local MCP server exposing the ceb-backend personal knowledge-graph API as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "anyio>=4.0",
]

[project.scripts]
ceb-mcp = "ceb_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceb_mcp"]
